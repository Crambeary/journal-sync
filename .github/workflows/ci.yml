name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # build.gradle targets Java 25 (options.release = 25); Gradle 9.7.1 also needs JDK 25.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # build.gradle sets useXVFB = true, so Loom wraps the game in xvfb-run itself;
      # the runner only needs Xvfb and xauth installed.
      - name: Install virtual framebuffer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      - name: Unit tests
        run: ./gradlew build

      - name: Production client game test
        run: ./gradlew runProductionClientGameTest

      - name: Upload game test screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gametest-screenshots
          path: run/screenshots/
          if-no-files-found: warn
